services:
  postgres:
    image: postgres:16-alpine
    container_name: talent-bridge-postgres
    environment:
      POSTGRES_DB: talent_bridge
      POSTGRES_USER: talent_bridge
      POSTGRES_PASSWORD: talent_bridge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talent_bridge -d talent_bridge"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talent-bridge-app
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/talent_bridge
      DB_USERNAME: talent_bridge
      DB_PASSWORD: talent_bridge
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:
