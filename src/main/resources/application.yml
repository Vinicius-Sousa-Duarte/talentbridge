spring:
  application:
    name: talent-bridge

  datasource:
    url: jdbc:h2:mem:talentbridge
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      "[hibernate.format_sql]": true

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  api-docs:
    path: /openapi

  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    "[com.dunkweb.talentbridge]": DEBUG
